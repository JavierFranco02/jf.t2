<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}ChipeSoft</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/estilos.css' | relative_url }}">
  <script>
    /* Tema claro u oscuro: se aplica antes de pintar para evitar parpadeos.
       Usa la misma clave ("tema") que el prototipo, así comparten la preferencia. */
    (function () {
      var guardado = null;
      try { guardado = localStorage.getItem('tema'); } catch (e) {}
      var oscuro = guardado ? guardado === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.tema = oscuro ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <header class="top">
    <a class="marca" href="{{ '/' | relative_url }}">
      <span class="logo"></span>
      <div>Ingeniería de Software I<small>4to B · T.M.</small></div>
    </a>

    <nav class="menu" aria-label="Principal">
      <a class="item {% if page.url == '/' %}on{% endif %}" href="{{ '/' | relative_url }}">Inicio</a>

      <div class="drop">
        <button type="button" class="item {% if page.url contains '/ejercitarios/' %}on{% endif %}" aria-haspopup="true" aria-expanded="false">Ejercitarios <span class="flecha">▾</span></button>
        <div class="drop-lista" hidden>
          <a href="{{ '/ejercitarios/unidad-01/respuestas.html' | relative_url }}" class="{% if page.url contains 'unidad-01' %}on{% endif %}">Unidad 1</a>
          <a href="{{ '/ejercitarios/unidad-02/respuestas.html' | relative_url }}" class="{% if page.url contains 'unidad-02' %}on{% endif %}">Unidad 2</a>
          <a href="{{ '/ejercitarios/unidad-03/respuestas.html' | relative_url }}" class="{% if page.url contains 'unidad-03' %}on{% endif %}">Unidad 3</a>
          <a href="{{ '/ejercitarios/unidad-04/respuestas.html' | relative_url }}" class="{% if page.url contains 'unidad-04' %}on{% endif %}">Unidad 4</a>
          {% comment %} Para agregar una unidad nueva, copiá una línea de arriba y cambiá el número. {% endcomment %}
        </div>
      </div>

      <div class="drop">
        <button type="button" class="item {% if page.url contains '/trabajo-practico/docs/' %}on{% endif %}" aria-haspopup="true" aria-expanded="false">Trabajo práctico <span class="flecha">▾</span></button>
        <div class="drop-lista" hidden>
          <a href="{{ '/trabajo-practico/docs/conceptualizacion.html' | relative_url }}" class="{% if page.url contains 'conceptualizacion' %}on{% endif %}">Conceptualización</a>
          <a href="{{ '/trabajo-practico/docs/analisis.html' | relative_url }}" class="{% if page.url contains 'analisis' %}on{% endif %}">Análisis</a>
          <a href="{{ '/trabajo-practico/docs/diseno.html' | relative_url }}" class="{% if page.url contains 'diseno' %}on{% endif %}">Diseño</a>
          <a href="{{ '/trabajo-practico/prototipo-interfaz-interactiva/login.html' | relative_url }}" target="_blank" rel="noopener">Prototipo ↗</a>
        </div>
      </div>
    </nav>

    <button type="button" class="tbtn" id="btn-tema"></button>
  </header>

  <main class="contenido">
    {{ content }}
  </main>

  <footer class="pie">
    Ingeniería de Software I · 4to B · T.M.
  </footer>

  <script>
    var SOL = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var LUNA = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
    var boton = document.getElementById('btn-tema');

    function pintarBoton() {
      var oscuro = document.documentElement.dataset.tema === 'dark';
      var texto = 'Cambiar a modo ' + (oscuro ? 'claro' : 'oscuro');
      boton.innerHTML = oscuro ? SOL : LUNA;
      boton.title = texto;
      boton.setAttribute('aria-label', texto);
    }

    boton.addEventListener('click', function () {
      var nuevo = document.documentElement.dataset.tema === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.tema = nuevo;
      try { localStorage.setItem('tema', nuevo); } catch (e) {}
      pintarBoton();
    });
    pintarBoton();

    /* Envuelve cada tabla en un contenedor para que se desplace de costado en pantallas chicas. */
    document.querySelectorAll('.contenido table').forEach(function (tabla) {
      var caja = document.createElement('div');
      caja.className = 'tabla';
      tabla.replaceWith(caja);
      caja.appendChild(tabla);
    });

    /* Menús desplegables: se abren con clic; se cierran al hacer clic afuera o con Escape. */
    var menus = document.querySelectorAll('.drop');

    function cerrarMenus(excepto) {
      menus.forEach(function (menu) {
        if (menu === excepto) return;
        menu.querySelector('.drop-lista').hidden = true;
        menu.querySelector('button').setAttribute('aria-expanded', 'false');
      });
    }

    menus.forEach(function (menu) {
      var boton = menu.querySelector('button');
      var lista = menu.querySelector('.drop-lista');
      boton.addEventListener('click', function (evento) {
        evento.stopPropagation();
        var abrir = lista.hidden;
        cerrarMenus(menu);
        lista.hidden = !abrir;
        boton.setAttribute('aria-expanded', abrir ? 'true' : 'false');
      });
    });

    document.addEventListener('click', function () { cerrarMenus(null); });
    document.addEventListener('keydown', function (evento) {
      if (evento.key === 'Escape') cerrarMenus(null);
    });
  </script>
</body>
</html>
